<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
<style>
    body{
        background-color: yellow;
    }

    h1 {
        color: rgb(255, 57, 229);
        background-color: rgb(0, 255, 221);
        font-family: Comic Sans MS;
        font-size: 67px;
        
    }
    div {
        display: flex;
        justify-content: center;
        align-items: center
    }

    img {
    display: block;
    margin-left: auto;
    margin-right: auto;
    image-resolution: 40%;
}
    
      .textofoda {
         margin-top: 5rem;
      }
      .textofoda span {
         display: inline-block;
         font-size: 130px;
         color: rgb(255, 0, 221);
         animation: designfoda 1.4s ease-in-out infinite;
         margin-left: 2%;
      }
      .textofoda span:nth-child(1) {
         animation-delay: 0.0s;
      }
      .textofoda span:nth-child(2) {
         animation-delay: 0.1s;
      }
      .textofoda span:nth-child(3) {
         animation-delay: 0.2s;
      }
      .textofoda span:nth-child(4) {
         animation-delay: 0.3s;
      }
      .textofoda span:nth-child(5) {
         animation-delay: 0.4s;
      }
      .textofoda span:nth-child(6) {
         animation-delay: 0.5s;
      }
      .textofoda span:nth-child(7) {
         animation-delay: 0.6s;
      }
      .textofoda span:nth-child(8) {
         animation-delay: 0.7s;
      }
      .textofoda span:nth-child(9) {
         animation-delay: 0.8s;
      }
      .textofoda span:nth-child(10) {
         animation-delay: 0.9s;
      }
      @keyframes designfoda {
         0% {
            transform: translateY(0rem);
         }
         55% {
            transform: translateY(-1.5rem);
         }
         100% {
            transform: translateY(0rem);
         }
      }
    
</style>
</head>
<body>
    <div class = "textofoda">
      <span> d </span>
      <span> e </span>
      <span> s </span>
      <span> i </span>
      <span> g </span>
      <span> n </span>
      <span> f </span>
      <span> o </span>
      <span> d </span>
      <span> a </span>
   </div>

    <img src="https://files.catbox.moe/vavzc4.png">

    <p style="text-align:center"><a href="/">Voltar</a></p>
</body>
</html>

{% extends 'base.html' %}
{% block content %}

<h2>Controle de Estoque</h2>
<br>
<details>
    <summary>[ Cadastrar novo jogo ]</summary>
    <div class="col-md-4">
        <form action="{{url_for('estoque')}}" method="POST">
            <input type="text" name="titulo" placeholder="Titulo" class="form-control" required>
            
            <input type="number" name="ano" placeholder="Ano" class="form-control" required>
            
            <input type="text" name="categoria" placeholder="categoria" class="form-control" required>
            
            <input type="text" name="plataforma" placeholder="plataforma" class="form-control" required>
            
            <input type="number" name="preco" placeholder="Preço" class="form-control" required>
            
            <input type="text" name="quantidade" placeholder="Quantidade" class="form-control" required>
            <br>
            <input type="submit" value="Cadastrar" class="btn btn-success">
            <input type="submit" value="Cadastrar" class="btn btn-danger">
        </form>
    </div>
</details>
<hr>

<table class="table table-bordered table-hover">
    <thead classic="table-dark">
        <tr>
            <th>Titulo</th>
            <th>Ano</th>
            <th>Categoria</th>
            <th>Plataforma</th>
            <th>Preço</th>
            <th>Quantidade</th>
        </tr>
    </thead>

    <tbody>
        <tr>
            <td></td>
            <td></td>
            <td></td>
            <td></td>
            <td></td>
            <td></td>
        </tr>
    </tbody>
</table>

{% endblock content%}
